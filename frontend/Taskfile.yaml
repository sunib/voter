# Frontend (Vue 3 + Vite) tasks. Included by the root Taskfile with dir: ./frontend,
# so every command here runs with this directory as the working directory.
version: '3'

tasks:
  deps:
    desc: Install node modules from the lockfile
    # `npm ci` deletes and recreates node_modules, which is slow and pointless when
    # nothing changed. Fingerprint the lockfile so repeated `task setup`/`task lint`
    # runs skip it; delete node_modules or touch the lockfile to force a reinstall.
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  lint:
    desc: Lint the frontend with ESLint and check that no colour is hardcoded
    deps: [deps]
    cmds:
      - npm run lint

  theme:
    desc: Screenshot every read surface in both colour schemes and check contrast
    # The check that would have caught the 2026-09-17 dark-mode defects, which
    # shipped because nobody had opened the app with a dark phone. It renders the
    # real components against the real stylesheet, measures computed contrast and
    # fails under 4.5:1, and leaves a PNG per scheme in theme-shots/ to look at.
    #
    # Not in `task lint`: it needs a browser binary (npx playwright install
    # chromium). `task lint` runs check-theme-tokens.mjs instead, which needs
    # nothing and catches the cause rather than the symptom.
    deps: [deps]
    cmds:
      - npm run theme:shoot -- --out theme-shots

  format:
    desc: Rewrite the frontend with Prettier
    deps: [deps]
    cmds:
      - npm run format

  test:
    desc: Unit-test, type-check and build the frontend
    # Three different checks, and all three matter. `vitest run` covers the API
    # client, where the bugs are not type errors: a request to a path the
    # backend no longer serves, or a mutation missing its CSRF header, compiles
    # perfectly and fails at runtime. `npm run build` runs `vue-tsc -b` first,
    # so it is also a real type check of every .vue and .ts file.
    deps: [deps]
    cmds:
      - npm run test
      - npm run build

  build:
    desc: Build the production bundle into dist/
    deps: [deps]
    cmds:
      - npm run build

  dev:
    desc: Run the Vite dev server against the remote API
    deps: [deps]
    cmds:
      - npm run dev

  dev-mock:
    desc: Run the Vite dev server against the in-process Kubernetes mock
    deps: [deps]
    cmds:
      - npm run dev:mock
