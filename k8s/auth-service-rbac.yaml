apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: voter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service
  namespace: voter
rules:
  # Access to manage session cookie secrets (namespaced)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # Mint short-lived tokens for the impersonator SA. Traefik attaches that
  # token to browser requests so the API server applies the Impersonate-*
  # headers set by forwardAuth. resourceNames pins this to the one SA we
  # actually need — no other SA in the namespace can be minted from here.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames:
    - voter-audience-impersonator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service
  namespace: voter
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: voter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auth-service
rules:
  # Access to quizsessions (cluster-scoped CRD)
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["quizsessions"]
    verbs: ["get", "list", "watch"]
  # Write join code into quizsession status
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["quizsessions/status"]
    verbs: ["patch"]
  # Access to quizsubmissions (cluster-scoped CRD)
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["quizsubmissions"]
    verbs: ["get", "list", "watch", "create"]
  # Read access to CoffeeConfig so the auth-service can render the storefront
  # and serve the admin GET. All writes go through impersonation, so the SA
  # deliberately does NOT have patch/update on coffeeconfigs — that closes the
  # silent-fallback-to-SA path if identity derivation ever returns empty.
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["coffeeconfigs"]
    verbs: ["get", "list", "watch"]
  # Impersonation: auth-service forwards user-initiated writes under the
  # audience member's synthetic "demo:<slug>" identity so audit logs (and
  # gitops-reverser) see the participant rather than the SA.
  #
  # The "users" verb is left unrestricted at the RBAC layer because participant
  # nicknames are slugged in code to "demo:<slug>" before reaching the API
  # server, which prevents collisions with any directly-bound K8s user. If the
  # attendee set ever becomes known, prefer resourceNames here too.
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  # Group is locked down to a single value so impersonated identities can only
  # ever inherit the limited voter-audience RBAC below.
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: ["voter-audience"]
  # ConfigButler reads the display-name and email off impersonation extras to
  # author the Git commit. Each extra key needs its own impersonate permission.
  - apiGroups: ["authentication.k8s.io"]
    resources:
      - "userextras/configbutler.ai/claims/display-name"
      - "userextras/configbutler.ai/claims/email"
    verbs: ["impersonate"]
---
# Permissions granted to impersonated audience members. Everyone who logs in via
# auth-service is mapped into the voter-audience group, so a single binding
# covers all of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience
  namespace: voter
rules:
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["coffeeconfigs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["quizsessions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["examples.configbutler.ai"]
    resources: ["quizsubmissions"]
    verbs: ["get", "list", "watch", "create"]
  # Audience members trigger ConfigButler save-now via CommitRequest. Create is
  # enough for the first cut; get/list/watch only matter if the UI surfaces
  # commit status (branch/SHA/phase) — see plans/configbutler-save-message-plan.md.
  - apiGroups: ["configbutler.ai"]
    resources: ["commitrequests"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter-audience
  namespace: voter
subjects:
  - kind: Group
    name: voter-audience
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter-audience
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auth-service
subjects:
  - kind: ServiceAccount
    name: auth-service
    namespace: voter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auth-service
