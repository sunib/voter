apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-client-auth
  namespace: voter
spec:
  # Defense in depth: drop any header the client might use to assert
  # identity BEFORE forwardAuth gets a chance to add the server-derived
  # ones. Two classes of header are stripped:
  #
  #   - Authorization: audience members must never bring their own
  #     Kubernetes bearer token through this ingress. The auth-service
  #     also rejects inbound Authorization, so this is the outer layer
  #     of defense.
  #   - Impersonate-*: without this strip, a malicious client could
  #     attach e.g. `Impersonate-User: system:admin` and — because the
  #     impersonator SA has unrestricted `impersonate users` — the API
  #     server would accept it.
  #
  # Every Impersonate-* header Kubernetes recognises today is listed; if
  # you add a new Impersonate-Extra-* key in the auth-service, list it
  # here too.
  headers:
    customRequestHeaders:
      Authorization: ""
      Impersonate-User: ""
      Impersonate-Group: ""
      Impersonate-Uid: ""
      Impersonate-Extra-configbutler.ai%2Fclaims%2Fdisplay-name: ""
      Impersonate-Extra-configbutler.ai%2Fclaims%2Femail: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-forwarder
  namespace: voter
spec:
  forwardAuth:
    address: http://auth-service.voter.svc.cluster.local:8080/private/forward-auth-decision
    trustForwardHeader: true
    # Authorization carries the impersonator SA token. Impersonate-* headers
    # carry the audience identity derived from the session cookie; the API
    # server uses them to re-authorize the request as demo:<stableID> in group
    # voter-audience, and the audit event records that user as the actor.
    authResponseHeaders:
      - Authorization
      - Impersonate-User
      - Impersonate-Group
      - Impersonate-Extra-configbutler.ai%2Fclaims%2Fdisplay-name
      - Impersonate-Extra-configbutler.ai%2Fclaims%2Femail
    addAuthCookiesToResponse:
      - auth_session
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: kube-apiserver-transport
  namespace: default
spec:
  rootCAs:
    - configMap: kube-root-ca.crt
  serverName: kubernetes.default.svc
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-api-examples-only
  namespace: voter
spec:
  entryPoints:
    - websecure
  routes:
    # All Kubernetes API paths. auth-forwarder requires a browser session
    # and mints an impersonator-SA token; client-supplied Authorization
    # and Impersonate-* headers are stripped first.
    - match: Host(`coffee.z65.nl`) && (PathPrefix(`/api`) || PathPrefix(`/apis`) || PathPrefix(`/openapi`))
      kind: Rule
      middlewares:
        # ORDER MATTERS: strip-client-auth must run before auth-forwarder so
        # forwardAuth's authResponseHeaders are the only source of
        # Authorization and Impersonate-* reaching the upstream Kubernetes API.
        - name: strip-client-auth
        - name: auth-forwarder
      services:
        - name: kubernetes
          namespace: default
          port: 443
          scheme: https
          serversTransport: default-kube-apiserver-transport@kubernetescrd
  tls: {}
---
