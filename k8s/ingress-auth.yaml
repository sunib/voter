# The /public API prefix. It shares a Service with the static assets now, so
# this route exists only to be explicit about which prefix is an API.
#
# There used to be a second route here rewriting /auth/* to /public/*. It was
# removed with the rename: /auth/login and /auth/callback are the OIDC client's
# own endpoints (voter/oidc_handlers.go), so rewriting that prefix would break
# login rather than protect anything.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: session-info
  namespace: voter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`voter.z65.nl`) && PathPrefix(`/public`)
      kind: Rule
      services:
        - name: voter
          port: http
          scheme: http
  tls: {}
