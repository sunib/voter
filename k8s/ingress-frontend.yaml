# The application catch-all: static assets, the SPA fallback and every API path
# are one Service now. More specific routes (ingress-auth.yaml,
# ingress-kubeapi.yaml) still win on their own prefixes.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: voter-app
  namespace: voter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`voter.z65.nl`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: voter
          port: http
          scheme: http
  tls: {}
