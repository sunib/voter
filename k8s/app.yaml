# One Deployment for the whole application. The Vue bundle is built into the
# same image and served by the Go backend from STATIC_DIR, so there is no
# separate frontend Deployment, Service or image any more.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voter
  namespace: voter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voter
    spec:
      serviceAccountName: voter
      imagePullSecrets:
        - name: zot-pull
      containers:
        - name: voter
          image: zot.z65.nl/voter/voter:coffee
          imagePullPolicy: Always
          env:
            # The token minted for this SA is what Traefik attaches to browser
            # requests as `Authorization`. It has impersonate-only RBAC — the
            # actual write authorization is via Impersonate-* headers that
            # forwardAuth derives from the session cookie. See plans/
            # quiz-submission-impersonation-plan.md.
            #
            # This is the LEGACY authentication mode (OIDC_ENABLED unset). It
            # must not be exposed publicly; see ../room-pass/login-explained.md.
            - name: FORWARD_SA
              value: voter-audience-impersonator
            - name: FORWARD_SA_NAMESPACE
              value: voter
            - name: COOKIE_SECURE
              value: "true"
            - name: ADMIN_PASSWORD
              value: testnetcoffee
            - name: COFFEE_CONFIG_NAME
              value: testnet-coffee
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "192Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: voter
  namespace: voter
spec:
  selector:
    app.kubernetes.io/name: voter
  ports:
    - name: http
      port: 8080
      targetPort: http
