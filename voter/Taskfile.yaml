# voter (Go) tasks. Included by the root Taskfile with dir: ./voter.
#
# This is the application backend: the coffee and quiz APIs, the Dex OIDC
# client, and -- in the container image -- the server for the built frontend.
# It was called auth-service, which described neither what it does nor what it
# owns; see ../ARCHITECTURE.md.
version: '3'

tasks:
  deps:
    desc: Download Go module dependencies
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download

  build:
    desc: Build the voter binary into bin/
    cmds:
      - mkdir -p bin
      # `.`, not ./...: test/loadtest is a second main package in this module.
      - go build -o ./bin/voter .

  test:
    desc: Run go vet and the unit tests
    cmds:
      - go vet ./...
      - go test ./...

  lint:
    desc: Lint with golangci-lint (config is the repository root .golangci.yml)
    cmds:
      - golangci-lint run ./...

  lint-fix:
    desc: Apply golangci-lint's automatic fixes
    cmds:
      - golangci-lint run --fix ./...

  test-stream-rehearsal:
    desc: Rehearse 200 independent stream identities in the disposable e2e fixture (task e2e-up)
    env:
      VOTER_STREAM_REHEARSAL: '1'
    cmds:
      - go test -run '^TestFixtureSharedStreamRehearsal$' -v -count=1 -timeout=4m

  voteload:
    desc: >-
      Rehearse a whole room voting for real: N participants each log in through
      Dex/Room Pass and cast a ballot with their own token. Writes to whatever
      cluster KUBECONFIG points at and produces two commits per ballot -- read
      docs/demo-day-readiness.ignore.md before pointing it at the demo cluster.
    cmds:
      - go run ./test/loadtest -round "{{.ROUND}}" -users "{{.USERS}}" -window "{{.WINDOW}}" {{.CLI_ARGS}}
    vars:
      USERS: '{{.USERS | default "200"}}'
      WINDOW: '{{.WINDOW | default "60s"}}'
      ROUND: '{{.ROUND | default ""}}'
