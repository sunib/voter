# A seat in the room, claimed by the participant sitting in it.
#
# Every Seat belongs to a SeatingPlan (seatingplans.yaml), which says how big
# the room is: rows facing the stage, row 1 closest to it, and seats in each
# row counted from the left as seen from the audience. Numbers start at 1, as
# they do on a real seat. The bounds here (1 to 30) are only the outer ones;
# admission (admission/seat-in-plan-policy.yaml) holds a new Seat to the plan's
# real size, and refuses any Seat whose plan is not the active one.
#
# The seat is in the NAME, <plan>-<row>-<column>, and that is the whole
# locking story: two phones claiming the same seat send two creates for one
# name, and the API server answers the second with 409 AlreadyExists. No
# controller in the claim, and no race. The rule below holds the name for everyone,
# operators included, so no Seat can sit at one place and be named after
# another.
#
# Where a seat is and whose it is never changes once it exists; its colour and
# emoji may. Whose it is, is the Kubernetes username of whoever claimed it
# (spec.claimedBy.username), held to the requester by admission
# (admission/seat-policy.yaml), and selectable, so "which seat is mine?" is one
# field selector. Labels (seatingplan, row, column) are held equal to the spec
# by admission too, since a CRD rule cannot see labels. docs/seat-claimed-by.md
# is the design.
#
# The status is a record, not a lock: status.lastCommit is the last why that
# reached Git for this seat, copied there by Voter from the seat's committed
# CommitRequest (voter/seat_reconciler.go). Only Voter's ServiceAccount may
# write seats/status, and a participant's patch of the seat cannot touch it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: seats.examples.configbutler.ai
spec:
  group: examples.configbutler.ai
  scope: Namespaced
  names:
    plural: seats
    singular: seat
    kind: Seat
    listKind: SeatList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Row
          type: integer
          jsonPath: .spec.row
        - name: Column
          type: integer
          jsonPath: .spec.column
        # Not "Name": kubectl already prints the object's name under NAME, and
        # two NAME columns read as one repeated.
        - name: Owner
          type: string
          jsonPath: .spec.claimedBy.displayName
        - name: Emoji
          type: string
          jsonPath: .spec.emoji
        - name: Color
          type: string
          jsonPath: .spec.color
        - name: Why
          type: string
          jsonPath: .status.lastCommit.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      # The API server answers "which seat is mine?" itself:
      # ?fieldSelector=spec.claimedBy.username=<username>, or kubectl's
      # --field-selector. Stable since Kubernetes 1.32.
      selectableFields:
        - jsonPath: .spec.claimedBy.username
      # Voter writes status.lastCommit; with the subresource, nobody writing the
      # seat itself can, and a status write moves no generation.
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Seat is one place in the room, claimed by the participant sitting
            there, in their colour and with their emoji. It is named
            <seating plan>-<row>-<column>, so a seat can be claimed once.
          required:
            - spec
          x-kubernetes-validations:
            # format() rather than concatenating string(row): the cost
            # estimator takes a concatenated string(int) as unbounded and
            # refuses the CRD.
            - rule: "self.metadata.name == '%s-%d-%d'.format([self.spec.seatingPlanRef.name, self.spec.row, self.spec.column])"
              messageExpression: "'A seat is named after its place: %s-%d-%d.'.format([self.spec.seatingPlanRef.name, self.spec.row, self.spec.column])"
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  # A plan name of up to 20, then -30-30. Bounding it is also
                  # what lets the API server afford the rule above.
                  maxLength: 26
            spec:
              type: object
              required:
                - seatingPlanRef
                - row
                - column
                - claimedBy
                - color
                - emoji
              properties:
                seatingPlanRef:
                  type: object
                  description: >-
                    The SeatingPlan this seat is on, in the same namespace.
                    Fixed once the seat is claimed.
                  required:
                    - name
                  properties:
                    group:
                      type: string
                      default: examples.configbutler.ai
                      enum:
                        - examples.configbutler.ai
                    kind:
                      type: string
                      default: SeatingPlan
                      enum:
                        - SeatingPlan
                    name:
                      type: string
                      description: The SeatingPlan's name, e.g. mission2.
                      maxLength: 20
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "A seat stays on its seating plan: seatingPlanRef is immutable."
                row:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: >-
                    The row, from 1 up to the SeatingPlan's rows. Row 1 is
                    closest to the stage. Fixed once the seat is claimed.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "A seat does not move: row is immutable."
                column:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: >-
                    The seat in its row, from 1 up to the SeatingPlan's
                    columns, counted from the left as seen from the audience,
                    facing the stage. Fixed once the seat is claimed.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "A seat does not move: column is immutable."
                claimedBy:
                  type: object
                  description: >-
                    Who claimed the seat. Fixed once the seat is claimed.
                  required:
                    - displayName
                    - username
                  properties:
                    displayName:
                      type: string
                      minLength: 1
                      maxLength: 128
                      description: >-
                        The name shown on the map: the one chosen at Room
                        Pass's join page, or a GitHub or LinkedIn profile's.
                    username:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: >-
                        The Kubernetes username of whoever claimed the seat,
                        as the API server makes it of their token, e.g.
                        demo:<id> or github:<email>. The identity; selectable.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "A seat keeps its owner: claimedBy is immutable."
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
                  description: >-
                    The seat's colour on the map, as #rrggbb. May change.
                emoji:
                  type: string
                  description: >-
                    The seat's emoji on the map, one of a fixed list chosen to
                    read well small and on a dark projector. May change. Adding
                    one is a change to this CRD.
                  # An enum rather than "is this one emoji": skin tones, ZWJ
                  # sequences and flags make that unanswerable in a schema, and
                  # the list guarantees nothing unexpected reaches the projector.
                  # The phone offers exactly these (frontend/src/api/seats.ts).
                  enum: ["🦊","🐙","🦄","🐝","🐢","🦉","🐳","🦖","🐧","🦀","🐸","🐼",
                         "🚀","🌵","🍄","🌈","⚡","🔥","🍕","🧇","☕","🎸","🎲","👾"]
            status:
              type: object
              description: >-
                Kept by Voter. Nothing here is written by the person sitting
                in the seat.
              properties:
                lastCommit:
                  type: object
                  description: >-
                    The last change to this seat that reached Git with its
                    owner's why, read off the seat's committed CommitRequest.
                    A change made without one (kubectl, say) leaves it as it
                    was.
                  properties:
                    message:
                      type: string
                      maxLength: 1024
                      description: The why, as committed.
                    commit:
                      type: string
                      maxLength: 64
                      description: The commit's sha in the audit trail.
                    committedAt:
                      type: string
                      format: date-time
                      description: When the CommitRequest reported the commit.
                    commitRequest:
                      type: string
                      maxLength: 253
                      description: The CommitRequest it was read from.
