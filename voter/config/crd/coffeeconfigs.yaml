apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coffeeconfigs.examples.configbutler.ai
spec:
  group: examples.configbutler.ai
  scope: Namespaced
  names:
    plural: coffeeconfigs
    singular: coffeeconfig
    kind: CoffeeConfig
    listKind: CoffeeConfigList
    shortNames:
      - coffeecfg
      - ccfg
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Shop
          type: string
          jsonPath: .spec.shopName
        - name: Currency
          type: string
          jsonPath: .spec.currency
        - name: Created
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              # vouchers is optional on purpose. The production copy is applied
              # by Flux with server-side apply, and SSA drops a keyed list that
              # its owner applies as [] instead of keeping it empty, so a
              # required vouchers refused "no vouchers" as `Required value`.
              # products has the same trap, closed the other way: it stays
              # required (coffee-price-policy reads it) and needs one item, so
              # [] is refused where it is typed, never reaching production.
              # docs/runbook-crd-updates.md, "Empty keyed lists".
              required:
                - shopName
                - currency
                - products
              properties:
                shopName:
                  type: string
                  minLength: 1
                bannerText:
                  type: string
                qrUrl:
                  type: string
                currency:
                  type: string
                  minLength: 1
                products:
                  type: array
                  minItems: 1
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - sku
                  items:
                    type: object
                    required:
                      - sku
                      - name
                      - priceCents
                    properties:
                      sku:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                      priceCents:
                        type: integer
                        minimum: 0
                      description:
                        type: string
                      enabled:
                        type: boolean
                vouchers:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - code
                  items:
                    type: object
                    required:
                      - code
                      - discountType
                      - discountValue
                    properties:
                      code:
                        type: string
                        minLength: 1
                      enabled:
                        type: boolean
                      discountType:
                        type: string
                        enum:
                          - percentage
                          - fixed
                      discountValue:
                        type: integer
                        minimum: 0
                      maximumUsage:
                        type: integer
                        minimum: 0
                      appliesToProducts:
                        type: array
                        items:
                          type: string
                      displayMessage:
                        type: string
                # Each key reference names exactly one Secret, or is absent:
                # whatever resolves it reads with its own rights, so a free name
                # would let a menu edit point it at the deploy or age keys in
                # the same namespace (docs/coffee-api-keys-design.md, decision 4).
                # An enum rather than CEL, so kubectl explain and the editor can
                # read the one allowed value. Menus stored before these rules
                # stay editable: validation ratchets on fields left alone.
                mail:
                  type: object
                  x-kubernetes-validations:
                    - rule: >-
                        (has(self.provider) && self.provider != '') == has(self.apiKeySecretRef)
                      message: >-
                        Mail needs a provider and its key reference together, or
                        neither: a provider without a key cannot send, and a key
                        without a provider is never used.
                  properties:
                    provider:
                      type: string
                    orderConfirmationTemplate:
                      type: string
                    fromAddress:
                      type: string
                    apiKeySecretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          enum:
                            - coffee-mail
                        key:
                          type: string
                          enum:
                            - apiKey
                payments:
                  type: object
                  x-kubernetes-validations:
                    - rule: >-
                        (has(self.provider) && self.provider != '') == has(self.apiKeySecretRef)
                      message: >-
                        Payments need a provider and its key reference together,
                        or neither: a provider without a key cannot take a
                        payment, and a key without a provider is never used.
                  properties:
                    provider:
                      type: string
                    mode:
                      type: string
                    zeroAmountCheckoutAllowed:
                      type: boolean
                    apiKeySecretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          enum:
                            - coffee-payments
                        key:
                          type: string
                          enum:
                            - apiKey
