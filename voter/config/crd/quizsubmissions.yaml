apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quizsubmissions.examples.configbutler.ai
spec:
  group: examples.configbutler.ai
  scope: Namespaced
  names:
    plural: quizsubmissions
    singular: quizsubmission
    kind: QuizSubmission
    listKind: QuizSubmissionList
    shortNames:
      - qsub
      - qsubs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Session
          type: string
          jsonPath: .spec.sessionRef.name
        - name: SubmittedAt
          type: date
          jsonPath: .spec.submittedAt
        - name: Created
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: QuizSubmission is a single attendee submission for a QuizSession.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - sessionRef
                - submittedAt
                - answers
              properties:
                sessionRef:
                  type: object
                  required:
                    - name
                  properties:
                    group:
                      type: string
                      default: examples.configbutler.ai
                      enum:
                        - examples.configbutler.ai
                    kind:
                      type: string
                      default: QuizSession
                      enum:
                        - QuizSession
                    name:
                      type: string
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                roundUID:
                  type: string
                  maxLength: 64
                  description: >-
                    The metadata.uid of the round this ballot was cast in. Optional:
                    a ballot written by hand need not know it. When present it must
                    match, or the ballot is filed but not counted -- so a ballot never
                    counts for a round recreated under the same name.
                questionsDigest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                  description: >-
                    The round's status.questionsDigest when this ballot was cast,
                    naming the questions it answered. Optional, like roundUID; when
                    present it must match the round's current questions.
                submittedAt:
                  type: string
                  format: date-time
                answers:
                  type: array
                  # A round has at most 25 questions (quizsessions.yaml), and a
                  # ballot answers each once at most.
                  maxItems: 25
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - questionId
                  items:
                    type: object
                    required:
                      - questionId
                    properties:
                      questionId:
                        type: string
                        maxLength: 63
                      singleChoice:
                        type: string
                        maxLength: 256
                      multiChoice:
                        type: array
                        maxItems: 20
                        items:
                          type: string
                          maxLength: 256
                      number:
                        type: number
                      freeText:
                        type: string
                        maxLength: 2000
                    x-kubernetes-validations:
                      - rule: "(has(self.singleChoice) ? 1 : 0) + (has(self.multiChoice) ? 1 : 0) + (has(self.number) ? 1 : 0) + (has(self.freeText) ? 1 : 0) == 1"
                        message: "exactly one answer field must be set"
