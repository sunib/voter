# A SAMPLE, not what the conference runs. The deployed rounds are `demo1` and
# `evaluation`, defined in the platform repository at
# k8s.koudijs.dev/2-gitops/voter-demo/demo-questions.yaml, and their names are
# stable rather than dated -- so the old advice here ("choose a NEW name for each
# round") no longer describes the demo. Resetting between runs is now the
# explicit delete in docs/demo-runbook.md, "Reset between runs".
#
# For the schema, every constraint and the traps, see
# docs/quizsession-authoring.md. Do not edit questions once voting has started:
# a ballot references its round by name, and answers reference question ids.
apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: demo-round-1
  namespace: voter
spec:
  title: How do you change Kubernetes configuration today?
  state: live
  questions:
    - id: approach
      title: Which approach do you use most?
      type: singleChoice
      required: true
      choices:
        - GitOps
        - kubectl or a cluster UI
        - A mix of both
        - I am still exploring
    - id: feedback
      title: What would make configuration changes easier for you?
      type: freeText
      placeholder: Optional — your answer will be visible to the room
