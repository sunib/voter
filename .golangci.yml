# golangci-lint configuration for the Go module in this repository (voter/).
# `task lint-golang` runs it, and CI runs the
# same task inside the CI container — so a failure here is reproducible with
# one command locally.
#
# This is a deliberate starting baseline, not the reverser's mature config. The
# standard linter set is on; every exclusion below names why it is off and what
# would let it come back. Nothing is suppressed silently.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - misspell

  settings:
    staticcheck:
      # "all" minus a style check that fights this codebase on purpose:
      # golangci-lint's default list, minus one more. The ST10xx entries other
      # than ours are staticcheck's own defaults: doc-comment style checks
      # (ST1000 package comments, ST1021 "comment on exported type X should
      # begin with X").
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # ST1013: "use http.StatusX instead of the numeric literal". The handlers
        # write numeric statuses consistently; staticcheck only flags a handful
        # of them, so enabling this gates on an arbitrary subset while the code
        # stays mixed. Convert them in one sweep, then drop this line.
        - "-ST1013"

  exclusions:
    generated: lax
    rules:
      # Test HTTP clients close response bodies for hygiene, not for a result the
      # test could act on. Checking those closes adds noise without adding signal;
      # errcheck still applies to every non-test file.
      - path: _test\.go
        linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"

      # voter is mid-migration: section 7 of the platform implementation
      # plan replaces its impersonation paths with participant ID tokens, and
      # these three leftovers (normalizeJoinCodeHeader, patchQuizSessionJoinCode,
      # parseSessionKey) belong to the design being replaced. Deleting them as a
      # drive-by would remove context from that migration; delete them WITH it,
      # then remove this rule.
      - path: (http_helpers|kube_client|session_ref)\.go
        linters: [unused]

issues:
  # Report every finding, not the first three per linter.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
