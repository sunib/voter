# Room Pass in Voter's fixture, as RELEASED by sunib/room-pass.
#
# The version is pinned three times below, and the three must move together:
# the deploy/base ref, the CRD ref, and the image. Dependabot does not see this
# file, so a Room Pass release reaches the fixture only when somebody bumps it
# here -- the same deliberate step the demo cluster takes for a new major.
#
# To bump: take the tag, then the digest from
#   docker buildx imagetools inspect ghcr.io/sunib/room-pass:<version>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voter
resources:
  - https://github.com/sunib/room-pass//deploy/base?ref=v2.2.0
  - https://github.com/sunib/room-pass//config/crd?ref=v2.2.0
images:
  - name: room-pass
    newName: ghcr.io/sunib/room-pass
    newTag: 2.2.0
    digest: sha256:6571a6318ddace93ff6ae14e7863e73f4f1e24b116c8610f0ae9ad7ea617ecc1
patches:
  # deploy/base carries Room Pass's own fixture origins (*.room-pass.test).
  # These are this fixture's, shaped like the demo cluster: the join page is on
  # the application's own host (edge.yaml routes /join, /bind and /logout there),
  # the issuer has a host of its own, and the only return URL is the application.
  - target:
      kind: Deployment
      name: room-pass
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: ROOM_NAME
            value: demo
          - name: ROOM_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: JOIN_ORIGIN
            value: https://app.voter.test:19443
          - name: ISSUER_ORIGIN
            value: https://login.voter.test:19443
          - name: DEX_UPSTREAM
            value: http://dex:5556
          - name: ALLOWED_RETURN_URLS
            value: https://app.voter.test:19443/
