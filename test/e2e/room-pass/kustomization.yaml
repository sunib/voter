# Room Pass in Voter's fixture, as RELEASED by sunib/room-pass.
#
# The version is pinned three times below, and the three must move together:
# the deploy/base ref, the CRD ref, and the image. Dependabot does not see this
# file, so a Room Pass release reaches the fixture only when somebody bumps it
# here -- the same deliberate step the demo cluster takes for a new major.
#
# To bump: take the tag, then the digest from
#   docker buildx imagetools inspect ghcr.io/sunib/room-pass:<version>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voter
resources:
  - https://github.com/sunib/room-pass//deploy/base?ref=v2.1.0
  - https://github.com/sunib/room-pass//config/crd?ref=v2.1.0
images:
  - name: room-pass
    newName: ghcr.io/sunib/room-pass
    newTag: 2.1.0
    digest: sha256:346b4422278dc7b2f6f2f20d52bee59874916e3021fb477321c0aacca19e58de
patches:
  # deploy/base carries Room Pass's own fixture origins (*.room-pass.test).
  # These are this fixture's: the join page and the issuer each get a host,
  # and the only return URL is the Voter application.
  - target:
      kind: Deployment
      name: room-pass
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: ROOM_NAME
            value: demo
          - name: ROOM_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: JOIN_ORIGIN
            value: https://join.voter.test:19443
          - name: ISSUER_ORIGIN
            value: https://login.voter.test:19443
          - name: DEX_UPSTREAM
            value: http://dex:5556
          - name: ALLOWED_RETURN_URLS
            value: https://app.voter.test:19443/
