# krm-foyer in Voter's fixture: step 1 of docs/krm-foyer-migration.md.
#
# On the application's own host, as it will be on demo.koudijs.dev, and signing in
# with the application's own Dex client (decision 3): the redirect URI Dex already
# allows, https://app.voter.test:19443/auth/callback, is the one krm-foyer serves.
#
# For now edge.yaml routes it /k8s/, /stream/ and /_foyer/ only. /auth/ is still
# Voter's, so nobody has a krm-foyer session yet; that moves with step 2, when the
# frontend speaks krm-foyer's contract.
#
# up.sh installs the chart and image pinned below, and creates the two Secrets.
publicURL: https://app.voter.test:19443
oidc:
  issuer: https://login.voter.test:19443
  clientID: voter-fixture
  clientSecret:
    secretName: krm-foyer-oidc
  # What Voter asks for today, and what authentication-config.yaml requires:
  # groups for the Room's audience group, federated:id for the connector.
  scopes: [openid, email, profile, groups, "federated:id"]
  # The fixture CA, as Voter trusts it through SSL_CERT_FILE.
  caConfigMap:
    name: issuer-ca
login:
  authorizationParameters:
    connector_id: {allowFromRequest: true, allowedValues: [room-pass, github]}
  sessionClaims:
    connector: /federated_claims/connector_id
sessionKeys:
  secretName: krm-foyer-session-keys
# Plain HTTP behind Traefik, which terminates TLS for the host. That hop carries
# session cookies, so only Traefik's pods may reach the port.
networkPolicy:
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
image:
  # As 2-gitops/krm-foyer/release.yaml pins it: the tag to read, the digest to run.
  tag: 0.3.0@sha256:6b620d658fdc3ff2fad394d2df27142ff706e8a4d20496ef810e6d45136ff6cf
