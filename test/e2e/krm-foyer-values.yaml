# krm-foyer in Voter's fixture: step 1 of docs/krm-foyer-migration.md.
#
# On the application's own host, as it will be on demo.koudijs.dev, and signing in
# with the application's own Dex client (decision 3): the redirect URI Dex already
# allows, https://app.voter.test:19443/auth/callback, is the one krm-foyer serves.
#
# edge.yaml routes it /auth/, /k8s/, /stream/ and /_foyer/: the frontend speaks
# krm-foyer's contract (step 2).
#
# up.sh installs the chart and image pinned below, and creates the two Secrets.
publicURL: https://app.voter.test:19443
oidc:
  issuer: https://login.voter.test:19443
  clientID: voter-fixture
  clientSecret:
    secretName: krm-foyer-oidc
  # What Voter asks for today, and what authentication-config.yaml requires:
  # groups for the Room's audience group, federated:id for the connector.
  scopes: [openid, email, profile, groups, "federated:id"]
  # The fixture CA, as Voter trusts it through SSL_CERT_FILE.
  caConfigMap:
    name: issuer-ca
login:
  authorizationParameters:
    # Room Pass unless a link asks for GitHub (the operator's "sign in as
    # operator"), so a room full of strangers is never shown the other door.
    connector_id: {default: room-pass, allowFromRequest: true, allowedValues: [room-pass, github]}
  sessionClaims:
    connector: /federated_claims/connector_id
sessionKeys:
  secretName: krm-foyer-session-keys
# One watch per scope for the whole room, each subscriber checked with a
# SubjectAccessReview before anything is disclosed (krm-foyer docs/watches.md).
# These are the resources Voter's pages follow live.
sharedWatches:
  resources:
    - coffeeconfigs.examples.configbutler.ai
    - quizsessions.examples.configbutler.ai
    - databases.platform.configbutler.ai
    - seats.examples.configbutler.ai
    - seatingplans.examples.configbutler.ai
    - rooms.room-pass.koudijs.dev
  # As the cluster: the grants in voter, shared in voter alone through a Role,
  # so the room's permission pages share one watch of them.
  namespacedResources:
    voter: [rolebindings.rbac.authorization.k8s.io]
# Plain HTTP behind Traefik, which terminates TLS for the host. That hop carries
# session cookies, so only Traefik's pods may reach the port.
networkPolicy:
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
image:
  # As 2-gitops/krm-foyer/release.yaml pins it: the tag to read, the digest to run.
  tag: 0.4.0@sha256:cab05ad9e50517cf321027c3195791f6a439addcebd774cdfd1e55fb3e0b8dcf
