apiVersion: v1
kind: ServiceAccount
metadata:
  name: voter
  namespace: voter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter
  namespace: voter
# Must mirror the platform repo's voter Role. Voter acts as itself for two
# things only: the storefront reads the one CoffeeConfig, and the tally
# reconciler reads rounds and ballots and writes a round's status. Everything a
# person does goes through krm-foyer's /k8s with their own token, and live
# streams are krm-foyer's, with shared watches of its own.
rules:
  - apiGroups: [examples.configbutler.ai]
    resources: [coffeeconfigs]
    resourceNames: [demo-coffee]
    verbs: [get]
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsessions]
    verbs: [get, list, watch]
  # The tally controller. It watches the API, so a ballot pasted with kubectl
  # moves the projected number exactly as one typed on a phone does.
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsubmissions]
    verbs: [list, watch]
  # ...and writes the result back, to the STATUS only: the controller
  # publishes the numbers without being able to edit the questions.
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsessions/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter
  namespace: voter
subjects:
  - kind: ServiceAccount
    name: voter
    namespace: voter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter
---
# Voter in the local fixture.
#
# The thing the audience actually sees: the real application, with the real
# session cookie, streaming a real Kubernetes object to more than one browser
# at once.
#
# The CoffeeConfig CRD lives in voter/config/crd/ and must be established first.
apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
  namespace: voter
spec:
  shopName: Fixture Coffee
  bannerText: Edit this menu
  currency: EUR
  products:
    - sku: coffee-flat-white
      name: Flat White
      priceCents: 395
      description: Double shot with silky milk
      enabled: true
    - sku: coffee-espresso
      name: Espresso
      priceCents: 275
      description: Small, strong, and fast
      enabled: true
  vouchers:
    - code: TESTNET
      enabled: true
      discountType: percentage
      discountValue: 100
      maximumUsage: 3
      displayMessage: TestNet coffee is on us
---
# The audience group the fixture's Room assigns. Participants read and patch the
# CoffeeConfig REST endpoints with their own token. Shared-stream access reviews
# check these same grants before disclosing service-account watch data.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience
  namespace: voter
rules:
  # Read only, as on the cluster: editing is the operator's live grant below.
  - apiGroups: [examples.configbutler.ai]
    resources: [coffeeconfigs]
    verbs: [get, list, watch]
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsessions]
    verbs: [get, list, watch]
  # Reading a ballot is everyone's; casting one is the ballot Role below.
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsubmissions]
    verbs: [get, list]
  # As the cluster's participant-rbac.yaml: the Databases pages are everyone's.
  - apiGroups: [platform.configbutler.ai]
    resources: [databases]
    verbs: [get, list, watch, create, patch, update]
---
# The grant the operator hands out live from /room, as in the cluster's
# participant-rbac.yaml: the Role is here, the RoleBinding is created and
# deleted by the operator page (or by a spec, standing in for the operator).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience-coffee-admin
  namespace: voter
rules:
  - apiGroups: [examples.configbutler.ai]
    resources: [coffeeconfigs]
    verbs: [patch, update]
---
# Who may vote, as in the cluster's participant-rbac.yaml: the Role is here and
# the operator page binds it to a group. Unlike the cluster, the fixture starts
# with the whole room bound, which is what every spec but the one about the
# switch expects; that spec takes it away and puts it back.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience-ballot
  namespace: voter
rules:
  - apiGroups: [examples.configbutler.ai]
    resources: [quizsubmissions]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter-audience-ballot-voter-audience
  namespace: voter
subjects:
  - kind: Group
    name: demo:voter-audience
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: voter-audience-ballot
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter-audience
  namespace: voter
subjects:
  - kind: Group
    name: demo:voter-audience
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: voter-audience
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: voter
  namespace: voter
spec:
  selector:
    app: voter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voter
  namespace: voter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voter
  template:
    metadata:
      labels:
        app: voter
    spec:
      serviceAccountName: voter
      containers:
        - name: voter
          image: voter:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUBERNETES_NAMESPACE
              value: voter
            - name: COFFEE_CONFIG_NAME
              value: demo-coffee
            # No ConfigButler in the fixture, so the save-message side effect is
            # switched off rather than left to fail on every write and make the
            # test read a partial success as a failure.
            - name: CONFIGBUTLER_GIT_TARGET_NAME
              value: ''
# The application's host is routed in edge.yaml, beside Room Pass's paths on it.
---
# Only Traefik may reach Voter. That is what makes Krm-Foyer-Identity
# trustworthy: the one route to /public/ always asks krm-foyer's check, which
# replaces any copy a browser sent, and nothing else can send Voter a header
# the check did not write (foyer_identity.go).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voter
  namespace: voter
spec:
  podSelector:
    matchLabels:
      app: voter
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
---
# The fixture's operator (dex.yaml's mockCallback connector, under the github
# id) is cluster-admin, as the cluster's GitHub operator is (krm-foyer
# migration, decision 2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voter-fixture-operator
subjects:
  - kind: User
    name: github:kilgore@kilgore.trout
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
