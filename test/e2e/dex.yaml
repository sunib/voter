apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: voter
data:
  config.yaml: |
    issuer: https://login.voter.test:19443
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    expiry:
      idTokens: 5m
    oauth2:
      skipApprovalScreen: true
    staticClients:
      # The one client: the real application.
      - id: voter-fixture
        name: Voter fixture
        secret: voter-fixture-secret
        redirectURIs:
          - https://app.voter.test:19443/auth/callback
    connectors:
      # The operator. The cluster's operator signs in through GitHub; the
      # fixture has no GitHub, so Dex's mockCallback connector stands in under
      # the same id: it signs in one fixed user, Kilgore Trout
      # <kilgore@kilgore.trout>, with no page of its own. authentication-config
      # maps the github connector to `github:` + email, as the cluster does, and
      # voter.yaml makes that user cluster-admin, as the cluster's operator is.
      - type: mockCallback
        id: github
        name: GitHub (fixture operator)
      - type: authproxy
        id: room-pass
        name: Join the room
        config:
          userIDHeader: X-Remote-User-Id
          userHeader: X-Remote-User
          userNameHeader: X-Remote-User-Name
          emailHeader: X-Remote-User-Email
          groupHeader: X-Remote-Group
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: voter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          args: [dex, serve, /etc/dex/config.yaml]
          ports:
            - containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 5556
      volumes:
        - name: config
          configMap:
            name: dex
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: voter
spec:
  selector:
    app: dex
  ports:
    - port: 5556
      targetPort: 5556
---
# Dex has no ingress of its own. Only Room Pass may assert authproxy headers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-only-from-room-pass
  namespace: voter
spec:
  podSelector:
    matchLabels:
      app: dex
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: room-pass
      ports:
        - protocol: TCP
          port: 5556
---
# Room Pass's reference policy (dex-only-from-room-pass, from its deploy/base)
# admits only Room Pass to Dex, because the authproxy connector believes the
# X-Remote-* headers it is sent. The fixture operator's connector needs Dex's
# own /callback from the browser too, so Traefik may reach Dex as well -- and
# edge.yaml routes it exactly that one path, with those headers stripped. Room
# Pass's callback is /callback/room-pass, which Traefik never sends to Dex.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-callback-from-traefik
  namespace: voter
spec:
  podSelector:
    matchLabels:
      app: dex
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5556
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
