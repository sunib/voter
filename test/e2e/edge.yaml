# A generous per-source edge bucket tolerates the shared conference NAT; the
# service separately limits code attempts and handoff creation across all sources.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: room-pass-edge-limit
  namespace: voter
spec:
  rateLimit:
    average: 200
    burst: 500
---
# K3s supplies Traefik. The join and issuer hosts go only to Room Pass, which
# proxies every Dex path it does not own itself. The application's own host is
# routed in voter.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: room-pass
  namespace: voter
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: voter-room-pass-edge-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: local-tls
      hosts: [join.voter.test, login.voter.test]
  rules:
    - host: join.voter.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: room-pass
                port:
                  number: 8080
    - host: login.voter.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: room-pass
                port:
                  number: 8080
