# Everything in this repository is pinned: action SHAs, the golang base image
# digest, tool versions in .devcontainer/Dockerfile's ENV block. Pinning without
# an update mechanism is just an old dependency with extra steps, so Dependabot
# is what keeps the pins moving.
#
# One pull request for all of it. Four ecosystems used to mean four weekly pull
# requests, each running the full CI on its own and each one stale against the
# others by the time it was looked at. multi-ecosystem-groups folds Go, npm,
# actions and docker into a single weekly bump, so there is one CI run to read
# and one thing to merge.
#
# The price of one pull request is that one bad bump makes all of it red. So
# npm and docker take no majors here: a TypeScript, Vite or Node major is a
# migration someone schedules, not a Monday bump, and left in it would hold
# every safe update back with it. Check for majors by hand now and then.
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directories:
      - "/voter"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "npm"
    # The browser suite pins Playwright; a directory left off this list
    # silently drifts.
    directories:
      - "/frontend"
      - "/test/browser"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "docker"
    # The devcontainer/CI base image plus the application Dockerfile, so
    # their FROM lines keep moving with upstream. /frontend has no Dockerfile
    # any more: the Vue bundle is built by voter/Dockerfile, whose node and
    # golang FROM lines are covered by the /voter entry.
    directories:
      - "/.devcontainer"
      - "/voter"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
