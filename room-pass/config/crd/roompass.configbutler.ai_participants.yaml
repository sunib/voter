---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: participants.roompass.configbutler.ai
spec:
  group: roompass.configbutler.ai
  names:
    kind: Participant
    listKind: ParticipantList
    plural: participants
    singular: participant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.roomRef.name
      name: Room
      type: string
    - jsonPath: .spec.revoked
      name: Revoked
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              displayName:
                description: |-
                  DisplayName is an unverified demo label, never an authorization key.

                  It is stored in its FOLDED form (see labelName in internal/server): what a
                  participant types is normalized before it reaches here, so this value is
                  legal in all three places it travels to -- a Kubernetes label value on
                  every ballot the voter app writes, one path segment in the mirrored audit
                  trail, and the tail of a submission's object name. The pattern is exactly
                  what the fold emits and is deliberately narrower than a label value: no
                  "_" or ".", because an object name is DNS-1123 and rejects the first.

                  MaxLength matches maxParticipantID rather than a label value's 63, so the
                  display name and the address derived from it share one limit instead of
                  two that disagree past forty characters.
                maxLength: 40
                minLength: 1
                pattern: ^[A-Za-z0-9]([-A-Za-z0-9]*[A-Za-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: displayName is immutable
                  rule: self == oldSelf
              revoked:
                default: false
                type: boolean
                x-kubernetes-validations:
                - message: revocation is irreversible
                  rule: '!oldSelf || self'
              roomRef:
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID prevents name reuse from reviving enrollment.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: roomRef is immutable
                  rule: self == oldSelf
            required:
            - displayName
            - revoked
            - roomRef
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
