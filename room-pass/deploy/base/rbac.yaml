apiVersion: v1
kind: ServiceAccount
metadata:
  name: room-pass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-pass
rules:
  - apiGroups: [roompass.configbutler.ai]
    resources: [rooms]
    verbs: [get, list, watch]
  - apiGroups: [roompass.configbutler.ai]
    resources: [rooms/status]
    verbs: [get, update, patch]
  - apiGroups: [roompass.configbutler.ai]
    resources: [participants]
    verbs: [get, list, create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [room-pass-cookie]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: room-pass
subjects:
  - kind: ServiceAccount
    name: room-pass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: room-pass
