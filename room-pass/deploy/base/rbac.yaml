apiVersion: v1
kind: ServiceAccount
metadata:
  name: room-pass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-pass
rules:
  - apiGroups: [roompass.configbutler.ai]
    resources: [rooms]
    verbs: [get, list, watch]
  - apiGroups: [roompass.configbutler.ai]
    resources: [rooms/status]
    verbs: [get, update, patch]
  - apiGroups: [roompass.configbutler.ai]
    resources: [participants]
    verbs: [get, list, create]
  - apiGroups: ['']
    resources: [secrets]
    # Fixed name, matched by cookieSecretName in cmd/room-pass/main.go. It is
    # deliberately not configurable: resourceNames is what keeps this Role from
    # being "read any Secret in the namespace", so the two have to agree and a
    # knob on one side alone would only ever fail closed.
    resourceNames: [room-pass-cookie]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: room-pass
subjects:
  - kind: ServiceAccount
    name: room-pass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: room-pass
