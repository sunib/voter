apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    resources:
      - group: roompass.configbutler.ai
        resources: [rooms, rooms/status, participants]
      - group: ''
        resources: [secrets]
  - level: RequestResponse
    namespaces: [demo]
    resources:
      - group: ''
        resources: [configmaps]
  - level: None
