# The CoffeeConfig CRD, applied and awaited BEFORE anything that uses it.
#
# It lives in its own file because kubectl apply of a CRD and a custom resource
# of that kind in one manifest is a race it usually loses: the CR is rejected
# with "no matches for kind" because the API server has not finished serving the
# new type yet.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: coffeeconfigs.examples.configbutler.ai
spec:
  group: examples.configbutler.ai
  names:
    kind: CoffeeConfig
    listKind: CoffeeConfigList
    plural: coffeeconfigs
    singular: coffeeconfig
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                shopName: { type: string }
                bannerText: { type: string }
                currency: { type: string }
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      sku: { type: string }
                      name: { type: string }
                      priceCents: { type: integer }
                      description: { type: string }
                      enabled: { type: boolean }
                vouchers:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      enabled: { type: boolean }
                      discountType: { type: string, enum: [percentage, fixed] }
                      discountValue: { type: integer, minimum: 0 }
                      maximumUsage: { type: integer, minimum: 0 }
                      appliesToProducts:
                        type: array
                        items: { type: string }
                      displayMessage: { type: string }
